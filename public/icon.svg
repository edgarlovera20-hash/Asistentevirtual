<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884" />
      <stop offset="100%" stop-color="#0b141a" />
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Android Adaptive Icon Background (Maskable Safe Area) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- WhatsApp Chat Bubble in Safe Zone (central 80%) -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Main Bubble -->
    <path d="M 0 -130 C 75 -130 135 -70 135 5 C 135 45 115 80 85 105 L 95 145 L 50 130 C 35 137 18 140 0 140 C -75 140 -135 80 -135 5 C -135 -70 -75 -130 0 -130 Z" fill="url(#bubble)" />

    <!-- AI Sparkle & Robot Motif -->
    <!-- AI Sparkle 1 -->
    <path d="M 60 -50 Q 60 -30 80 -30 Q 60 -30 60 -10 Q 60 -30 40 -30 Q 60 -30 60 -50 Z" fill="#ffffff" />
    <!-- AI Sparkle 2 (Small) -->
    <path d="M 85 -70 Q 85 -60 95 -60 Q 85 -60 85 -50 Q 85 -60 75 -60 Q 85 -60 85 -70 Z" fill="#ffffff" opacity="0.9" />

    <!-- Central Checkmark / AI Assistant Core -->
    <path d="M -45 10 L -15 40 L 55 -30" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Android Robot Antenna Accent -->
  <circle cx="256" cy="72" r="14" fill="#25D366" />
  <line x1="256" y1="86" x2="256" y2="105" stroke="#25D366" stroke-width="8" stroke-linecap="round" />
</svg>
